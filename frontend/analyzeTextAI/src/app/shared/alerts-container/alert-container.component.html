<div class="fixed bottom-0 right-0 p-6 z-[150] flex flex-col gap-4 pointer-events-none">
    @for (alert of alertService.alerts; track alert.id) {
        <div [ngClass]="alertStyles[alert.tipeAlert]"
             animate.enter="fade-in-right"
             animate.leave="fade-out-right"
             class="pointer-events-auto w-96 border rounded-lg p-4 shadow-xl animate-in slide-in-from-right-full duration-300">
        
            <div class="flex items-start gap-3">
                <div class="flex-shrink-0 mt-0.5" [ngClass]="iconColors[alert.tipeAlert]">
                    @if (alert.icon === 'check') {
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
                    } @else {
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" /></svg>
                    }
                </div>

                <div class="flex-1">
                    <h3 class="font-bold text-sm tracking-tight">{{ alert.title }}</h3>
                    <p class="text-sm mt-1 opacity-90 leading-relaxed">{{ alert.text }}</p>
                </div>
            </div>
        </div>
    }
</div>
