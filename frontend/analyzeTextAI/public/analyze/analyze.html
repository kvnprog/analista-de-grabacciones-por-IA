<div class="min-h-screen bg-gray-100 p-8">
  <!-- Header -->
  <div class="flex items-center gap-3 mb-8">
    <div class="bg-blue-900 text-white font-bold px-3 py-1 rounded">MC</div>
    <h1 class="text-xl font-semibold text-gray-800">
      Sistema de búsqueda de palabras por grabaciones mediante IA
    </h1>
  </div>

  <!-- Main content -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 bg-white p-8 rounded shadow">

    <!-- Subir grabaciones -->
    <div>
      <h2 class="font-semibold text-gray-700 mb-4">Subir grabaciones</h2>

      <div
        class="border-2 border-dashed border-gray-300 rounded p-6 text-center bg-gray-50"
      >
        <input
          type="file"
          multiple
          accept="audio/*"
          (change)="onFilesSelected($event)"
          class="block w-full text-sm text-gray-600
                 file:mr-4 file:py-2 file:px-4
                 file:rounded file:border-0
                 file:text-sm file:font-semibold
                 file:bg-blue-50 file:text-blue-700
                 hover:file:bg-blue-100"
        />
        <p class="text-xs text-gray-500 mt-2">
          Arrastra tus audios o selecciónalos 
        </p>
      </div>

     <button
  class="mt-4 bg-blue-900 text-white px-6 py-2 rounded hover:bg-blue-800 disabled:opacity-50"
  (click)="submit()"
  [disabled]="loading"
>
  <span *ngIf="!loading">Enviar</span>
  <span *ngIf="loading">Procesando...</span>
</button>

<!-- Spinner -->
<div *ngIf="loading" class="mt-4 flex items-center gap-2 text-blue-900">
  <div
    class="w-5 h-5 border-2 border-blue-900 border-t-transparent rounded-full animate-spin">
  </div>
  <span>Procesando audios...</span>
</div>

<!-- Mensaje éxito -->
<div
  *ngIf="!loading && successMessage"
  class="mt-4 text-green-600 font-semibold"
>
  {{ successMessage }}
</div>
    </div>

    <!-- Agregar palabras -->
    <div>
      <h2 class="font-semibold text-gray-700 mb-4">Agregar palabra</h2>

      <input
        type="text"
        [(ngModel)]="newWord"
        placeholder="Nombre de la campaña"
        class="w-full border rounded px-3 py-2 mb-3"
      />

      <button
        class="bg-blue-900 text-white px-4 py-2 rounded hover:bg-blue-800"
        (click)="addWord()"
      >
        Agregar
      </button>

      <div class="mt-6">
        <h3 class="font-semibold text-gray-700 mb-2">Lista de palabras</h3>
        <ul class="mt-2 space-y-2">
  <li
    *ngFor="let word of words; let i = index"
    class="flex items-center justify-between bg-gray-100 px-3 py-2 rounded"
  >
    <span class="text-gray-700">{{ word }}</span>

    <button
      class="text-red-600 hover:text-red-800 font-bold"
      (click)="removeWord(i)"
      title="Eliminar"
    >
      ✕
    </button>
  </li>
</ul>
      </div>
    </div>

  </div>
</div>
