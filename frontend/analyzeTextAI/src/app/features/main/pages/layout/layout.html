<div class="flex h-screen bg-slate-50 overflow-hidden">
    <app-sidebar [isCollapsed]="sidebarCollapsed"></app-sidebar>

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 pl-5">
        <div class="flex items-center">
            <button (click)="toggleSidebar()" class="p-2 mr-4 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            
            <h2 class="text-lg font-semibold text-gray-800 tracking-tight">
                {{ titleService.moduleTitle() }}
            </h2>
        </div>

        <div class="flex items-center space-x-4">
            <div class="text-right hidden sm:block">
                <p class="text-sm font-bold text-gray-900">{{ full_name }}</p>
                <p class="text-[10px] text-green-500 font-medium">AI ACTIVE: {{ id_user }}</p>
            </div>
            <div class="h-10 w-10 rounded-full bg-[#0c0259] flex items-center justify-center text-white border-2 border-slate-100">
                {{ user_data.name[0] }}{{ user_data.last_name[0] }}
            </div>
        </div>
        </header>

        <section class="flex-1 overflow-y-auto p-8 bg-slate-50">
            <router-outlet></router-outlet>
        </section>
    </main>
</div>
