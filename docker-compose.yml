version: "3.9"

services:
  frontend:
    build: ./frontend/analyzeTextAI
    ports:
      - "3000:80"   # host:contenedor
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: .  # La raíz del proyecto
      dockerfile: ./backend/Dockerfile
    container_name: grabaciones-backend
    environment:
      - PYTHONPATH=/app/backend:/app/shared
    volumes:
      - .:/app  # Mapeamos todo el proyecto a /app
    ports:
      - "9100:9100"
    restart: always

  postgres:
        image: postgres:14
        container_name: postgres-analyst
        restart: always

        environment:
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASS}
        - POSTGRES_DB=${DB_NAME}

        volumes:
        - ./infra/local/postgres_data:/var/lib/postgresql/data
        
        ports:
        - "5432:5432"

        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
          interval: 4s
          timeout: 3s
          retries: 4

  nginx:
    image: nginx:1.27-alpine
    container_name: grabaciones-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend