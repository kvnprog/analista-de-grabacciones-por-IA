<aside [ngClass]="isCollapsed ? 'w-20' : 'w-64'" 
       class="bg-[#0c0259] text-white flex flex-col transition-all duration-300 ease-in-out shadow-xl h-screen overflow-hidden flex-shrink-0">
    
    <div class="h-16 flex items-center px-4 border-b border-white/5">
        <div class="flex items-center w-full" [ngClass]="isCollapsed ? 'justify-center' : 'justify-start'">
            <div class="bg-white p-1 pt-3 pb-3 rounded-lg flex-shrink-0">
                <img src="mca/logo-mc-corporativo-azul.png" 
                     alt="logo-mc-corporativo" 
                     [ngClass]="isCollapsed ? 'w-12' : 'w-12'" >
            </div>
            <span *ngIf="!isCollapsed" class="ml-2 text-xl font-bold tracking-tight whitespace-nowrap animate-in fade-in">
                Corporativo<span class="text-gray-400"> Muñoz</span>
            </span>
        </div>
    </div>

    <hr />

    <nav class="flex-1 px-3 mt-6 space-y-2">
        <a routerLink="/layout/home" 
           class="flex items-center h-12 rounded-xl hover:bg-white/5 transition-all group">
            <div class="w-12 flex-shrink-0 flex justify-center items-center">
                <svg class="h-6 w-6 text-indigo-300 group-hover:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
            </div>
            <span *ngIf="!isCollapsed" class="ml-1 font-medium whitespace-nowrap">Incio</span>
        </a>

        <a routerLink="/layout/analyze" 
           class="flex items-center h-12 rounded-xl hover:bg-white/5 transition-all group">
            <div class="w-12 flex-shrink-0 flex justify-center items-center">
                <svg class="h-6 w-6 text-indigo-300 group-hover:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
            </div>
            <span *ngIf="!isCollapsed" class="ml-1 font-medium whitespace-nowrap">Analizador audios</span>
        </a>
    </nav>

    <div class="p-4 border-t border-white/10">
        <button class="flex items-center h-12 w-full rounded-xl hover:bg-red-500/20 text-indigo-100 transition-all overflow-hidden" (click)="onLogout()">
            <div class="w-12 flex-shrink-0 flex justify-center items-center">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
            </div>
            <span *ngIf="!isCollapsed" class="ml-1 font-medium whitespace-nowrap">Cerrar Sesión</span>
        </button>
    </div>
</aside>
